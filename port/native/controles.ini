# Controles do port nativo de Jet Force Gemini (Forest First).
# O controle Xbox vira um controle de N64: o jogo recebe valores brutos do
# N64, e a zona morta e o alcance do próprio jogo continuam no joyClamp original.

# Opção de controle do menu original.
# normal: A pula, B agacha.  expert: C-cima pula, C-baixo agacha.
modo = normal

# Analógico esquerdo -> analógico do N64.
zona_morta = 0.10    ; fração do curso ignorada, para controles com folga
alcance = 80         ; valor bruto do N64 com o analógico no fim do curso

# Analógico direito -> botões C.
limiar_c = 0.50

# Gatilhos: pressão mínima para contar como botão (0 a 254).
limiar_gatilho = 30

# Botões do controle Xbox. Destinos: A, B, Z, L, R, START, C_CIMA, C_BAIXO,
# C_ESQUERDA, C_DIREITA, DIRECIONAL_CIMA, DIRECIONAL_BAIXO,
# DIRECIONAL_ESQUERDA, DIRECIONAL_DIREITA, NADA e REINICIAR (função do port:
# volta ao ponto de entrada). Combine destinos com +. O direcional do Xbox é
# sempre o direcional do N64.
A = A
B = B
X = B
Y = NADA
LB = L
RB = R
LT = R
RT = Z
START = START
BACK = REINICIAR
L3 = NADA
R3 = NADA
